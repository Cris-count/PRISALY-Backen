name: backend-ci

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify without Docker
        run: sh ./mvnw -B -pl app -am clean verify
