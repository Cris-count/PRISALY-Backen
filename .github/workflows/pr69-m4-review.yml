name: DC-REV-PR69-01 PostgreSQL review (temporary)
on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/pr69-m4-review.yml
      - .github/scripts/pr69_m4_review.py
permissions:
  contents: read
jobs:
  persistence-review:
    if: github.head_ref == 'review/pr69-m4'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b97ba887629b6229fdd9676877e31049be4c3461
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: candidate/**/pom.xml
      - name: Focused persistence and D-06 regression on exact merged SHA
        working-directory: candidate
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/pr69-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/pr69-evidence/product-sha.txt"
          sh ./mvnw -B -pl app -am verify -Pdocker-it -Dtest=ReferenciasCanonicasTest,ValorRespuestaContratoTest,MapeoIntentoFilasCorruptasTest,ErroresTecnicosM5Test,RespuestaHttpErroresTecnicosTest,ModelosLimitesEInmutabilidadTest,M4CoordinacionInicioTest -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=FallosTecnicosM5IT,RevisionMacro02PersistenciaIT,RobustezPersistenciaM5IT,ConcurrenciaLectorM5M6ReservaD06IT,ConsultaIntentoEvaluacionM5M6IT,HistorialM4M5IT,ParticipacionesPortWiringIT -Dfailsafe.failIfNoSpecifiedTests=false 2>&1 | tee "$RUNNER_TEMP/pr69-evidence/maven-raw.log"
      - name: Sanitize and verify every required suite
        if: always()
        working-directory: candidate
        env:
          CANDIDATE_SHA: b97ba887629b6229fdd9676877e31049be4c3461
          EXPECTED_SUITE: com.prisaly.config.HistorialM4M5IT
        run: python3 ../review/.github/scripts/pr69_m4_review.py "$RUNNER_TEMP/pr69-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr69-m4-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr69-evidence
          retention-days: 14
          if-no-files-found: error
