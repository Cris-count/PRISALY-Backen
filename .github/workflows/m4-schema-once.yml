name: DC-M1-POSTCIERRE-02 M4 schema (temporary)
on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/m4-schema-once.yml
      - .github/scripts/m4_schema_evidence.py
      - m4/src/main/java/com/prisaly/m4/infrastructure/config/M4Schema*
      - m4/src/main/resources/m4-schema/**
      - m4/src/test/java/com/prisaly/m4/infrastructure/M4SchemaContractTest.java
      - app/src/test/java/com/prisaly/config/M4Schema*
permissions:
  contents: read
jobs:
  schema:
    if: github.head_ref == 'fix/m4-guarda-esquema-dd02'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate references from isolated canonical SQL
        run: |
          mkdir -p "$RUNNER_TEMP/m4-schema-evidence"
          sh ./mvnw -B -pl app -am verify -Pdocker-it -Dtest=M4SchemaContractTest -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=M4SchemaReferenceIT -Dfailsafe.failIfNoSpecifiedTests=false 2>&1 | tee "$RUNNER_TEMP/m4-schema-evidence/maven-raw.log"
      - name: Sanitize and summarize
        if: always()
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/m4_schema_evidence.py "$RUNNER_TEMP/m4-schema-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-schema-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m4-schema-evidence
          retention-days: 14
          if-no-files-found: error
