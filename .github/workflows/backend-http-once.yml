name: DC-EJEC-02 HTTP (temporary campaign)

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/backend-http-once.yml
      - qa/backend-http/**

permissions:
  contents: read

jobs:
  http-acceptance:
    if: github.head_ref == 'test/backend-http-aceptacion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact campaign harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: campaign
          persist-credentials: false
      - name: Checkout pinned product candidate
        uses: actions/checkout@v4
        with:
          ref: bc8e378bd6dd50a3b1484b06c268932ba5607dd3
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: candidate/**/pom.xml
      - name: Prepare isolated campaign
        env:
          HARNESS_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p candidate/qa/backend-http "$RUNNER_TEMP/http-evidence"
          cp -a campaign/qa/backend-http/. candidate/qa/backend-http/
          printf '%s\n' "$HARNESS_SHA" > "$RUNNER_TEMP/http-evidence/harness-sha.txt"
          git -C candidate rev-parse HEAD > "$RUNNER_TEMP/http-evidence/product-sha.txt"
          node --test --test-reporter=tap candidate/qa/backend-http/run.test.mjs > "$RUNNER_TEMP/http-evidence/harness-tests.tap"
      - name: Run real HTTP acceptance with disposable PostgreSQL 16.15
        working-directory: candidate
        run: node qa/backend-http/run.mjs --expected-sha bc8e378bd6dd50a3b1484b06c268932ba5607dd3
      - name: Preserve sanitized results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-http-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/qa/backend-http/evidence/
            ${{ runner.temp }}/http-evidence/
          retention-days: 14
          if-no-files-found: error
