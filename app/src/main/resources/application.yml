spring:
  application:
    name: prisaly-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/prisaly?sslmode=disable}
    username: ${DATABASE_USER:prisaly}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: true

server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: /api

prisaly:
  auditoria:
    # PD-01: persistent permission audit. The operating environment must back up this directory
    # and restrict access to it.
    permisos:
      directorio: ${PRISALY_AUDITORIA_DIR:logs/auditoria}
      retencion-dias: ${PRISALY_AUDITORIA_RETENCION_DIAS:365}
  m1:
    student-access:
      enabled: false
    # DM1-06 (DC-M1-04): failed personnel logins per account and per origin (TCP peer) in a sliding window.
    # In-memory counters: academic local environment only (lost on restart, not shared between instances).
    autenticacion:
      intentos:
        max-por-cuenta: 5
        max-por-origen: 20
        ventana: PT15M
    # DM1-04 (DC-M1-04) / D-04 (DC-P5-FASE-B-01): role given to teachers created by POST /v1/admin/docentes.
    # DOCENTE is seeded by PD-01; if the catalog lacks it the operation answers 503 TEACHER_ROLE_NOT_CONFIGURED.
    administracion:
      rol-docente: ${PRISALY_ROL_DOCENTE:DOCENTE}
    # P5 / DM1-01 (DC-P5-FASE-B-01): one-shot first-administrator initialization, never via HTTP. Disabled by default.
    # The initial password is read once from a file readable only by the operator, and is never logged.
    inicializacion-admin:
      habilitada: ${PRISALY_INICIALIZACION_ADMIN:false}
      correo: ${PRISALY_INICIALIZACION_ADMIN_CORREO:}
      nombre: ${PRISALY_INICIALIZACION_ADMIN_NOMBRE:}
      archivo-credencial: ${PRISALY_INICIALIZACION_ADMIN_ARCHIVO:}
  m3:
    # Institutional read policy for M3 case reads (DC-M3-RES-02), I1 (DC-I1-F4-IMPLEMENTACION-FINAL-01):
    #   permiso CONSULTAR_CASO        -> authorized by Dirección Central (existing permission, none created);
    #   estados-visibles (D2)         -> communicated as approved: the owner reads Borrador, Publicado, Archivado;
    #   requiere-activo=false (D3)    -> communicated as approved: the owner also reads own inactive cases.
    # Ownership is still enforced by M3. Writes keep their own M1 permissions; F4-H1-alcance remains pending.
    lectura:
      permiso: CONSULTAR_CASO
      estados-visibles: BORRADOR,PUBLICADO,ARCHIVADO
      requiere-activo: false
  m4:
    consulta-bd0052:
      enabled: true
  m7:
    worker:
      enabled: false
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
