spring:
  application:
    name: prisaly-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/prisaly?sslmode=disable}
    username: ${DATABASE_USER:prisaly}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: true

server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: /api

prisaly:
  auditoria:
    # PD-01: persistent permission audit. The operating environment must back up this directory
    # and restrict access to it.
    permisos:
      directorio: ${PRISALY_AUDITORIA_DIR:logs/auditoria}
      retencion-dias: ${PRISALY_AUDITORIA_RETENCION_DIAS:365}
  m1:
    student-access:
      enabled: false
    # DM1-06 (DC-M1-04): failed personnel logins per account and per origin (TCP peer) in a sliding window.
    # In-memory counters: academic local environment only (lost on restart, not shared between instances).
    autenticacion:
      intentos:
        max-por-cuenta: 5
        max-por-origen: 20
        ventana: PT15M
    # DM1-04 (DC-M1-04) / D-04 (DC-P5-FASE-B-01): role given to teachers created by POST /v1/admin/docentes.
    # DOCENTE is seeded by PD-01; if the catalog lacks it the operation answers 503 TEACHER_ROLE_NOT_CONFIGURED.
    administracion:
      rol-docente: ${PRISALY_ROL_DOCENTE:DOCENTE}
    # P5 / DM1-01 (DC-P5-FASE-B-01): one-shot first-administrator initialization, never via HTTP. Disabled by default.
    # The initial password is read once from a file readable only by the operator, and is never logged.
    inicializacion-admin:
      habilitada: ${PRISALY_INICIALIZACION_ADMIN:false}
      correo: ${PRISALY_INICIALIZACION_ADMIN_CORREO:}
      nombre: ${PRISALY_INICIALIZACION_ADMIN_NOMBRE:}
      archivo-credencial: ${PRISALY_INICIALIZACION_ADMIN_ARCHIVO:}
  m3:
    # DC-BE-SIM-INCREMENTO-A-15: candidate narrative script (M3). OFF: no bean, no port towards M5 and no teacher
    # route. Turning it on also requires the QA-only V017 schema (db/sim-propuesta) and is NOT an approved extension.
    narrativa:
      publicacion:
        enabled: false
    # Institutional read policy for M3 case reads (DC-M3-RES-02), I1 (DC-I1-F4-IMPLEMENTACION-FINAL-01):
    #   permiso CONSULTAR_CASO        -> authorized by Dirección Central (existing permission, none created);
    #   estados-visibles (D2)         -> communicated as approved: the owner reads Borrador, Publicado, Archivado;
    #   requiere-activo=false (D3)    -> communicated as approved: the owner also reads own inactive cases.
    # Ownership is still enforced by M3. Writes keep their own M1 permissions; F4-H1-alcance remains pending.
    lectura:
      permiso: CONSULTAR_CASO
      estados-visibles: BORRADOR,PUBLICADO,ARCHIVADO
      requiere-activo: false
  m5:
    # DC-BE-CIERRE-FUNCIONAL-09 (fase 3): POST /v1/estudiantes/sesiones/{idSesion}/intentos y
    # POST /v1/estudiantes/intentos/{idIntento}/finalizar quedan SIN publicar. DC-BE-M5-CIERRE-IMPLEMENTACION-45
    # ratificó e implementó E1, L1, RF-22, V1-c y DD-14-a; publicarlos sigue requiriendo activación expresa.
    inicio-finalizacion:
      publicacion:
        enabled: false
    # DC-BE-SIM-B1-B2A-24 (Incremento B, B1-B2a): candidate attempt phases (exploration / questionnaire). OFF: no phase
    # code is assembled and M5 never touches "FaseIntento". Turning it on also requires the QA-only V017+V018 schema
    # (db/sim-propuesta + db/sim-propuesta-b) and the M3 narrative; it publishes no route and ratifies no decision.
    exploracion:
      fases:
        enabled: false
        # DC-BE-SIM-B2B-B3-32 (B3): HTTP exposure of the student phase routes P1-P4 (narrativa, fase, cuestionario,
        # completitud). OFF: the routes do not exist (404). Turning it on with fases.enabled=false fails startup
        # (M5-FASES-HTTP-REQUIERE-FASES): exposing routes never bypasses the unavailable phases.
        http:
          enabled: false
  m4:
    consulta-bd0052:
      enabled: true
  m6:
    # DC-BE-M6-DESBLOQUEO-IMPLEMENTACION-55: teacher evaluation (S1, owner teacher, one immutable grade) and the
    # teacher query, POST/GET /v1/evaluacion/intentos/{idIntento}. OFF: no bean, no route (404). Release N2 and the
    # student query are NOT implemented (B2 pending a schema change). Turning it on is not authorized.
    evaluacion:
      enabled: false
  m7:
    worker:
      enabled: false
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
