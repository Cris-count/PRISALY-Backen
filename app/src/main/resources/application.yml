spring:
  application:
    name: prisaly-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/prisaly?sslmode=disable}
    username: ${DATABASE_USER:prisaly}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: true

server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: /api

prisaly:
  auditoria:
    # PD-01: persistent permission audit. The operating environment must back up this directory
    # and restrict access to it.
    permisos:
      directorio: ${PRISALY_AUDITORIA_DIR:logs/auditoria}
      retencion-dias: ${PRISALY_AUDITORIA_RETENCION_DIAS:365}
  m1:
    student-access:
      enabled: false
    # DM1-06 (DC-M1-04): failed personnel logins per account and per origin (TCP peer) in a sliding window.
    # In-memory counters: academic local environment only (lost on restart, not shared between instances).
    autenticacion:
      intentos:
        max-por-cuenta: 5
        max-por-origen: 20
        ventana: PT15M
    # DM1-04 (DC-M1-04): role given to teachers created by POST /v1/admin/docentes. Blank until Dirección Central
    # defines the teacher role in the catalog; while blank the operation answers 503 TEACHER_ROLE_NOT_CONFIGURED.
    administracion:
      rol-docente: ${PRISALY_ROL_DOCENTE:}
  m3:
    # Institutional read policy for GET /v1/casos/{id} (DC-M3-RES-02). Pending ratification by
    # Dirección Central: permission and visible states stay blank, so every read is denied.
    lectura:
      permiso: ""
      estados-visibles: ""
      requiere-activo: true
  m4:
    consulta-bd0052:
      enabled: true
  m7:
    worker:
      enabled: false
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
