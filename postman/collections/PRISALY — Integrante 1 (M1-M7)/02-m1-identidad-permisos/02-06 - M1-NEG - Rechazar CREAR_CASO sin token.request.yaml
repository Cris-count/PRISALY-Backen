$kind: http-request
name: 02-06 | M1-NEG | Rechazar CREAR_CASO sin token
description: Equivalente a personal-autorizacion-crear-caso-unauthenticated.
url: "{{baseUrl}}/v1/personal/autorizacion/crear-caso"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 401", function () { pm.response.to.have.status(401); });
      pm.test("JSON", function () { pm.response.to.be.json; });
      const body = pm.response.json();
      pm.test("code UNAUTHENTICATED", function () { pm.expect(body.code).to.eql("UNAUTHENTICATED"); });
    language: text/javascript
order: 7000
