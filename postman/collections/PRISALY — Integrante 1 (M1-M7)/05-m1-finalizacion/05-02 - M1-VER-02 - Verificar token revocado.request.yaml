$kind: http-request
name: 05-02 | M1-VER-02 | Verificar token revocado
description: El mismo accessToken debe fallar tras 05-01.
url: "{{baseUrl}}/v1/personal/me"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 401", function () { pm.response.to.have.status(401); });
      pm.test("JSON", function () { pm.response.to.be.json; });
      const body = pm.response.json();
      pm.test("code UNAUTHENTICATED", function () { pm.expect(body.code).to.eql("UNAUTHENTICATED"); });
    language: text/javascript
order: 2000
