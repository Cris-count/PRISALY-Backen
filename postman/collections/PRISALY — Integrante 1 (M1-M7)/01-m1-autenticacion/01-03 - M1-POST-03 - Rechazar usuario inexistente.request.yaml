$kind: http-request
name: 01-03 | M1-POST-03 | Rechazar usuario inexistente
description: No sobrescribe accessToken.
url: "{{baseUrl}}/v1/personal/autenticar"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |
    {
      "correo": "{{unknownEmail}}",
      "password": "{{personnelPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 401", function () { pm.response.to.have.status(401); });
      pm.test("JSON", function () { pm.response.to.be.json; });
      const body = pm.response.json();
      pm.test("code AUTH_FAILED", function () { pm.expect(body.code).to.eql("AUTH_FAILED"); });
    language: text/javascript
order: 3000
