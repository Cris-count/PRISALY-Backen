$kind: http-request
name: 01-04 | M1-NEG-01 | Rechazar usuario inactivo
description: Seed M1 inactive.bruno. No sobrescribe accessToken.
url: "{{baseUrl}}/v1/personal/autenticar"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |
    {
      "correo": "{{inactiveEmail}}",
      "password": "{{inactivePassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 401", function () { pm.response.to.have.status(401); });
      pm.test("JSON", function () { pm.response.to.be.json; });
      const body = pm.response.json();
      pm.test("code AUTH_FAILED", function () { pm.expect(body.code).to.eql("AUTH_FAILED"); });
    language: text/javascript
order: 4000
