name: prisaly-ops70-local
services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: prisaly_ops70
      POSTGRES_USER: prisaly_ops70
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [pg_data:/var/lib/postgresql/data]
    networks: [local]
    labels: {com.prisaly.instance: ops70-root}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports: ['127.0.0.1:${MAILPIT_PORT:-18025}:8025', '127.0.0.1:${SMTP_PORT:-11025}:1025']
    networks: [local, edge]
    labels: {com.prisaly.instance: ops70-root}
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: {context: ., dockerfile: Dockerfile.backend}
    image: prisaly-ops70-backend:local
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/prisaly_ops70?sslmode=disable
      DATABASE_USER: prisaly_ops70
      APP_PORT: '8080'
      PRISALY_AUDITORIA_DIR: /var/log/prisaly/auditoria
      CORS_ORIGINS: http://localhost:${WEB_PORT:-18170},http://127.0.0.1:${WEB_PORT:-18170}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: '1025'
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: 'false'
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: 'false'
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: '5000'
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: '5000'
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      PRISALY_INICIALIZACION_ADMIN: 'false'
      PRISALY_M1_STUDENT_ACCESS_ENABLED: 'false'
      PRISALY_M3_LISTADO_ENABLED: 'false'
      PRISALY_M3_NARRATIVA_PUBLICACION_ENABLED: 'false'
      PRISALY_M5_INICIO_FINALIZACION_PUBLICACION_ENABLED: 'false'
      PRISALY_M5_EXPLORACION_FASES_ENABLED: 'false'
      PRISALY_M5_EXPLORACION_FASES_HTTP_ENABLED: 'false'
      PRISALY_M6_EVALUACION_ENABLED: 'false'
      PRISALY_M7_WORKER_ENABLED: 'false'
      PRISALY_M7_CODIGO_ACCESO_WORKER_ENABLED: 'false'
    secrets: [postgres_password]
    volumes: [audit_data:/var/log/prisaly]
    networks: [local]
    labels: {com.prisaly.instance: ops70-root}
    depends_on:
      postgres: {condition: service_healthy}
      mailpit: {condition: service_healthy}
    healthcheck:
      test: [CMD, java, -cp, /app/health, Healthcheck, 'http://127.0.0.1:8080/api/health']
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 20s
  frontend:
    build: {context: ., dockerfile: Dockerfile.frontend}
    image: prisaly-ops70-frontend:local
    ports: ['127.0.0.1:${WEB_PORT:-18170}:80']
    networks: [local, edge]
    labels: {com.prisaly.instance: ops70-root}
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 15
networks:
  local:
    internal: true
  edge:
volumes:
  pg_data:
  audit_data:
secrets:
  postgres_password:
    file: .secrets/postgres-password
